name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Check tag version
        run: |
          PACKAGE_VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PACKAGE_VERSION, tag=$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build the web bundle
        run: |
          bun run build:web
          bun run build:embed

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile --target=bun-linux-x64 --outfile dist/mdiv-linux-x64
          bun build src/cli.ts --compile --target=bun-linux-arm64 --outfile dist/mdiv-linux-arm64
          bun build src/cli.ts --compile --target=bun-darwin-x64 --outfile dist/mdiv-darwin-x64
          bun build src/cli.ts --compile --target=bun-darwin-arm64 --outfile dist/mdiv-darwin-arm64
          bun build src/cli.ts --compile --target=bun-windows-x64 --outfile dist/mdiv-windows-x64.exe

      - name: Package binaries
        run: |
          mkdir -p dist/package/linux-x64 dist/package/linux-arm64 dist/package/darwin-x64 dist/package/darwin-arm64 dist/package/windows-x64
          cp dist/mdiv-linux-x64 dist/package/linux-x64/mdiv
          cp dist/mdiv-linux-arm64 dist/package/linux-arm64/mdiv
          cp dist/mdiv-darwin-x64 dist/package/darwin-x64/mdiv
          cp dist/mdiv-darwin-arm64 dist/package/darwin-arm64/mdiv
          cp dist/mdiv-windows-x64.exe dist/package/windows-x64/mdiv.exe
          tar -czf dist/mdiv-linux-x64.tar.gz -C dist/package/linux-x64 mdiv
          tar -czf dist/mdiv-linux-arm64.tar.gz -C dist/package/linux-arm64 mdiv
          tar -czf dist/mdiv-darwin-x64.tar.gz -C dist/package/darwin-x64 mdiv
          tar -czf dist/mdiv-darwin-arm64.tar.gz -C dist/package/darwin-arm64 mdiv
          cd dist/package/windows-x64
          zip ../../mdiv-windows-x64.zip mdiv.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            --generate-notes
